<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><title>心愿簿</title>
<style>:root{color-scheme:light;--canvas:#f5f7f4;--surface:#fff;--ink:#202e26;--muted:#536158;--line:#dbe3dc;--accent:#24583e;--soft:#e9f1eb}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1024px;margin:auto;padding:24px 24px 56px}
header{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:0 0 20px;border-bottom:1px solid var(--line)}
.brand{font-size:1.25rem;font-weight:750;white-space:nowrap}
.account-controls,.tools,.profile-actions,.pairbar,.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.account-controls{justify-content:flex-end;gap:14px;min-width:0}
.account-summary{display:flex;align-items:center;gap:10px;min-width:0}
.account-summary strong,.current-account{overflow-wrap:anywhere}
.account-summary strong{display:block}
.account-summary .avatar{width:48px;height:48px;margin:0;flex:none}
.avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;vertical-align:middle;background:var(--soft);margin-right:6px}
.avatar-fallback{display:inline-grid;place-items:center;font-size:1.15em}
.profile-label{display:inline-flex;align-items:center}
#avatarDraft .avatar{width:52px;height:52px;font-size:1.6rem}
small{display:block;color:var(--muted);font-size:.875rem}
h1,h2,h3,p{margin:0}h1{font-size:1.75rem;line-height:1.3;letter-spacing:-.02em}
.hero{padding:28px 0 22px}
.hero p{margin-top:8px;color:var(--muted)}
h2{font-size:1.125rem}h3{font-size:1rem}
button{cursor:pointer;font:inherit;line-height:1.3;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:8px 12px;min-height:40px}
button:hover:not(:disabled){background:var(--soft)}
button:disabled{opacity:.48;cursor:default}
.primary{background:var(--accent);color:white;border-color:var(--accent)}
.primary:hover:not(:disabled){background:#1d4933}
button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.workspace-toolbar{display:flex;justify-content:flex-start;margin-top:16px}
.workspace-toolbar button{background:transparent;color:var(--muted);font-size:.875rem}
.workspace-toolbar button:hover{color:var(--ink)}
.pairbar{margin-bottom:16px}.pairbar:empty{display:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.grid h2{margin-bottom:10px}
.card{display:grid;grid-template-columns:52px minmax(0,1fr);align-items:center;gap:12px;text-align:left;width:100%;border:0;border-radius:6px;padding:9px 4px}
.card strong{display:block;overflow-wrap:anywhere}.bought strong{text-decoration:line-through}
.icon,.card img{width:52px;height:52px;border-radius:8px;object-fit:cover}
.icon,.cover-empty{display:grid;place-items:center;background:var(--soft)}
.tabs{display:none}
details{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
summary{cursor:pointer;color:var(--muted)}
.empty{color:var(--muted);padding:8px 0}
dialog{border:1px solid var(--line);border-radius:14px;color:inherit;width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 32px);padding:22px;background:var(--surface)}
dialog::backdrop{background:#17261e80}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.row{margin:12px 0}
label{display:block;margin:12px 0}
input,textarea,select{display:block;width:100%;padding:9px 10px;border:1px solid #aab9ae;border-radius:7px;font:inherit;background:var(--surface);color:var(--ink);margin-top:4px}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{min-height:76px}
.photo{max-width:100%;max-height:200px;border-radius:8px}.cover-preview,.cover-empty{width:112px;height:112px;object-fit:cover;border-radius:10px}
.cover-empty,a{color:var(--accent)}a{overflow-wrap:anywhere}
.error{color:#9b3324}.error:empty{display:none}.invite{padding:8px 0}
@media(min-width:651px){.grid section[hidden]{display:block!important}}
@media(max-width:650px){
  main{padding:16px 14px 32px}
  header{align-items:flex-start;flex-direction:column;gap:10px;padding-bottom:14px}
  .account-controls{width:100%;justify-content:space-between;gap:8px}
  .account-summary{flex:1}.account-summary .avatar{width:42px;height:42px}
  .profile-actions{gap:6px}.profile-actions button{padding-inline:8px}
  .hero{padding:20px 0 16px}h1{font-size:1.375rem}
  .grid{grid-template-columns:1fr}.tabs{display:flex;gap:8px;margin-bottom:10px}
}
.hero p:empty{display:none}
.empty-pairs{display:grid;justify-items:center;gap:10px;text-align:center;padding:clamp(44px,10vw,96px) 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.empty-pairs h2{font-size:1.25rem}
.empty-pairs p{color:var(--muted);max-width:28rem}
.empty-pairs button{margin-top:6px}
.id-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;font-variant-numeric:tabular-nums}
.id-row strong{margin-right:auto}
.invitation-section{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.invitation-section h3{margin-bottom:6px}
.sent-invite{display:flex;align-items:center;justify-content:space-between;gap:12px}
.invite-status{background:var(--soft);border-radius:999px;padding:3px 9px;white-space:nowrap}
.pair-module{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.pair-module-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.pair-module-header h2{min-width:0;overflow-wrap:anywhere}
.pair-module-header button{flex:none}
.pair-module .grid section{background:var(--canvas)}
#pairManagement{margin-top:20px}
.managed-pair{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0}
.managed-pair+.managed-pair{border-top:1px solid var(--line)}
.managed-pair-identity{display:flex;align-items:center;gap:4px;min-width:0;overflow-wrap:anywhere}
.managed-pair-identity .avatar,.managed-pair button{flex:none}
.danger-action{color:#9b3324;border-color:#e2c1b9}
.price-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.price-fields label{margin-bottom:6px}


#fxNote{display:block;margin-bottom:12px;color:var(--muted);font-size:.875rem}
.editor-source{padding-top:4px}
.editor-source h3,.editor-review h3{font-size:1.125rem}
.editor-hint{color:var(--muted);font-size:.875rem;margin-top:4px}
.ai-bridge{margin:20px 0 0;padding:14px 0;border-block:1px solid var(--line)}
#organize{width:100%;min-height:50px;display:flex;justify-content:center;align-items:center;gap:9px;font-weight:700}
#organize[aria-busy=true]{opacity:1;cursor:progress;background:var(--accent)}
.organize-icon{display:inline-grid;place-items:center;width:18px;height:18px}
#organize[aria-busy=true] .organize-icon{border:2px solid #ffffff60;border-top-color:white;border-radius:50%;font-size:0;animation:organize-spin .8s linear infinite}
@keyframes organize-spin{to{transform:rotate(360deg)}}
#editStatus{font-size:.875rem;color:var(--muted);margin-top:8px}
#editStatus:empty{display:none}
.editor-review{margin-top:20px}
.editor-review h3:focus{outline:none}
.editor-actions{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
@media(prefers-reduced-motion:reduce){#organize[aria-busy=true] .organize-icon{animation:none}}
.cover-picker{margin:16px 0}
.cover-picker h4{margin:0;font-size:.9375rem}
.cover-picker .row{align-items:center;gap:14px}
.cover-picker-controls{min-width:0}
.cover-options{display:flex;flex-wrap:wrap;gap:6px}
.cover-options:not(:empty){margin-bottom:8px}
.cover-choice{display:grid;place-items:center;gap:3px;padding:3px 4px;font-size:.75rem}
.cover-choice img{width:44px;height:44px;object-fit:contain;border-radius:4px}
.cover-choice[aria-pressed=true]{border-color:var(--accent);background:var(--soft)}
#editor{padding:0;overflow:hidden;max-height:calc(100dvh - 32px)}
#wishForm{display:flex;flex-direction:column;max-height:calc(100dvh - 34px);min-height:0}
.editor-header{flex:none;margin:0;padding:14px 20px;border-bottom:1px solid var(--line)}
.editor-scroll{overflow-y:auto;overscroll-behavior:contain;min-height:0;padding:12px 20px 18px}
.editor-materials{border:0;padding:0;margin:0}
.editor-materials summary{font-size:1rem;font-weight:700;color:var(--ink)}
.editor-materials[open] .ai-bridge{border-bottom:0;padding-bottom:0}
.editor-review{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.editor-actions{flex:none;margin:0;padding:10px 20px;background:var(--surface)}
@media(max-width:650px){
  #editor{width:100%;max-width:100%;margin:auto auto 0;border-radius:16px 16px 0 0;max-height:calc(100dvh - 12px)}
  #wishForm{max-height:calc(100dvh - 14px)}
  .editor-header,.editor-scroll,.editor-actions{padding-left:16px;padding-right:16px}
  .editor-actions{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .editor-actions button{width:100%;min-height:46px}
}
.editor-step{display:inline-block;margin-right:5px;padding:2px 7px;border-radius:5px;background:var(--soft);color:var(--accent);font-size:.875rem;font-weight:700;vertical-align:baseline;white-space:nowrap}
.card-art{position:relative;display:block;width:52px;height:52px}
.card-art img{position:absolute;inset:0}
.card-art img:not([data-loaded]),.detail-cover:not([data-loaded]){display:none}
#detail{width:min(610px,calc(100vw - 24px));padding:0;overflow:hidden}
.detail-shell{max-height:calc(100dvh - 34px);display:flex;flex-direction:column}
.detail-header{padding:18px 20px 14px;gap:14px;align-items:flex-start;flex:none}
.detail-header h2{font-size:1.2rem;overflow-wrap:anywhere;line-height:1.35}
.detail-close{display:grid;place-items:center;width:42px;height:42px;padding:0;flex:0 0 42px;font-size:1.5rem;white-space:nowrap}
.detail-scroll{overflow-y:auto;min-height:0;padding:16px 20px 20px}
.detail-overview{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:20px}
.detail-art{position:relative;min-width:0;aspect-ratio:1;max-height:220px;display:grid;place-items:center;background:var(--canvas);border:1px solid var(--line);border-radius:10px}
.detail-art span{font-size:1.5rem}
.detail-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;border-radius:inherit}
.detail-facts{display:grid;justify-items:start;gap:8px;min-width:0;overflow-wrap:anywhere}
.detail-facts .detail-price{font-size:1.6rem;font-weight:750;line-height:1.15;margin-top:-5px}
.detail-preference{background:var(--soft);color:var(--accent);padding:3px 8px;border-radius:6px;font-size:.875rem}
.detail-notes{border-top:1px solid var(--line);padding-top:14px;margin-top:18px}
.detail-notes p{margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted)}
.detail-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line);flex:none}
@media(max-width:650px){
  .detail-header,.detail-scroll,.detail-actions{padding-inline:14px}
  .detail-overview{gap:12px;grid-template-columns:minmax(0,2fr) minmax(0,3fr)}
  .detail-header h2{font-size:1.125rem}
}

.detail-source{font-size:.875rem}
.screenshot-field{margin:12px 0}
.screenshot-label{display:block;margin-bottom:4px}
#photoStatus:empty,#coverStatus:empty{display:none}
.profile-panel{padding:14px;border:1px solid var(--line);border-radius:10px;margin-top:12px}
.profile-pair-row{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
.profile-pair-row h3{color:var(--muted);font-size:.875rem}
#profileCode{font-size:1.125rem;font-variant-numeric:tabular-nums}
.profile-invite{margin-top:14px;padding-top:2px;border-top:1px solid var(--line)}
.profile-invite textarea{resize:vertical;min-height:8rem}
.profile-panel button.primary{margin-top:8px}
.profile-panel [role=status]:empty{display:none}
.profile-avatar-row{margin:8px 0}
.screenshot-list{list-style:none;margin:0 0 8px;padding:0;display:flex;gap:8px;flex-wrap:wrap}
.screenshot-tile{position:relative;width:76px;height:76px}
.screenshot-thumb{display:grid;place-items:center;width:100%;height:100%;padding:0;overflow:hidden;background:var(--canvas);font-size:.75rem;color:var(--muted)}
.screenshot-thumb img{width:100%;height:100%;object-fit:cover}
.screenshot-remove{position:absolute;right:3px;top:3px;display:grid;place-items:center;width:26px;height:26px;min-height:26px;padding:0;border-radius:50%;font-size:1rem}
#largeScreenshot{display:block;max-width:100%;max-height:65dvh;object-fit:contain;margin:auto}

.screenshot-box{border:1px solid #aab9ae;border-radius:8px;overflow:hidden;background:var(--surface)}
.screenshot-box:focus-within,.screenshot-box.drag-over{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
#screenshotPaste{border:0;margin:0;border-radius:0;min-height:64px;resize:none;padding:10px;cursor:text}
#screenshotPaste:focus-visible{outline:none}
.screenshot-tools{display:flex;align-items:center;gap:10px;padding:7px 9px;border-top:1px solid var(--line)}
.screenshot-tools button{min-height:36px}
@media(max-width:650px),(pointer:coarse){
  #screenshotPaste{display:none}
  .screenshot-box{border:0;background:transparent;overflow:visible}
  .screenshot-tools{border:0;padding:0}
  .screenshot-box:focus-within{box-shadow:none}
}
</style>
<main><header><div class="brand">心愿簿</div><div class="tools account-controls"><div class="account-summary" id="accountSummary" hidden><div id="accountAvatar" class="avatar avatar-fallback" aria-hidden="true">?</div><div><strong id="accountName"></strong><small id="accountId" hidden></small><small class="current-account" id="currentAccount"></small></div></div><div class="profile-actions"><button id="login" class="primary" hidden>用 Google 登录</button><button id="profile" hidden>编辑资料</button><button id="signout" hidden>退出</button></div></div></header>
<div class="hero"><h1>把心动记下来，把惊喜留给以后。</h1><p id="intro">正在连接清单…</p></div>
<p id="status" role="status" class="error"></p>
<div id="workspace" hidden><section id="pairModule" class="pair-module" aria-labelledby="pairTitle" hidden><div class="pair-module-header"><h2 id="pairTitle"></h2><button id="add" class="primary" disabled>＋ 记个愿望</button></div><nav class="pairbar" id="pairs" aria-label="切换配对"></nav><div class="tabs" id="tabs" hidden><button type="button" data-side="mine" class="primary">我的愿望</button><button type="button" data-side="other">对方的愿望</button></div><div class="grid" id="lists"></div></section><div class="workspace-toolbar" id="workspaceToolbar" hidden><button id="pair">新增绑定</button></div><section id="emptyPairs" class="empty-pairs" aria-labelledby="emptyPairsTitle" hidden><h2 id="emptyPairsTitle">去找你的心愿搭子吧</h2><p>用对方的六位 ID 发个邀请，配对后就能一起记礼物。</p><button type="button" class="primary" id="startPair">寻找搭子</button></section></div></main>
<dialog id="profileDialog" aria-labelledby="profileTitle">
  <div class="bar"><h2 id="profileTitle">编辑资料</h2><button type="button" data-close>关闭</button></div>
  <section class="profile-panel" aria-labelledby="profilePairHeading">
    <div class="profile-pair-row">
      <div><h3 id="profilePairHeading">我的配对 ID</h3><strong id="profileCode"></strong></div>
      <div class="tools">
        <button type="button" id="copyProfileCode" disabled>复制 ID</button>
        <button type="button" id="generateInvite" aria-controls="profileInvite" aria-expanded="false" disabled>生成邀请</button>
      </div>
    </div>
    <div id="profileInvite" class="profile-invite" hidden>
      <label>邀请文案<textarea id="inviteText" rows="5" readonly></textarea></label>
      <button type="button" class="primary" id="copyInvite">复制邀请</button>
    </div>
    <p id="profileShareStatus" class="editor-hint" role="status"></p>
  </section>
  <form id="profileForm" class="profile-panel">
    <h3>昵称与头像</h3>
    <label>昵称<input name="nickname" maxlength="40" required></label>
    <div class="row profile-avatar-row"><span id="avatarDraft"></span><button type="button" id="shuffleAvatar">换一换</button></div>
    <small>头像和昵称会显示给你的配对对象。</small>
    <p id="profileStatus" role="status"></p>
    <button class="primary">保存资料</button>
  </form>
  <details id="pairManagement"><summary>配对管理</summary><div id="managedPairs"></div></details>
</dialog><dialog id="endPairDialog" aria-labelledby="endPairTitle"><div class="bar"><h2 id="endPairTitle">解除配对</h2></div><p id="endPairMessage"></p><p id="endPairStatus" class="error" role="status"></p><div class="row"><button type="button" data-close autofocus>取消</button><button type="button" class="danger-action" id="confirmEndPair">确认解除</button></div></dialog><dialog id="pairing"><div class="bar"><h2>配对</h2><button data-close>关闭</button></div><p class="editor-hint">每份清单只对该配对的两个人可见。</p><div class="id-row"><span>我的配对 ID</span><strong id="mycode"></strong><button type="button" id="copy">复制 ID</button></div><form id="search"><label>对方的配对 ID<input id="targetcode" inputmode="numeric" pattern="[0-9]{6}" placeholder="输入六位数字 ID" required></label><button>查找</button></form><div id="found"></div><p id="pairStatus" role="status"></p><section class="invitation-section"><h3>收到的邀请</h3><div id="invites"></div></section><section class="invitation-section"><h3>发出的邀请</h3><div id="sentInvites"></div></section></dialog>
<dialog id="editor" aria-labelledby="editTitle"><form id="wishForm">
<div class="bar editor-header"><h2 id="editTitle">记个愿望</h2><button type="button" data-close autofocus>关闭</button></div>
<div id="editorScroll" class="editor-scroll">
<details id="editorMaterials" class="editor-materials" open><summary id="sourceHeading"><span class="editor-step">Step 1</span> 提供素材</summary><section class="editor-source" aria-labelledby="sourceHeading"><p class="editor-hint">描述、链接、截图，至少提供一项。</p><label>礼物描述<textarea name="source" placeholder="例如：想要一副索尼降噪耳机"></textarea></label><label>商品链接<input name="link" type="url" placeholder="https://…"></label><div class="screenshot-field">
  <span class="screenshot-label" id="screenshotLabel">截图</span>
  <input name="image" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
  <ul id="screenshotList" class="screenshot-list" aria-label="已添加的截图" hidden></ul>
  <div class="screenshot-box" id="screenshotBox">
    <textarea id="screenshotPaste" rows="2" inputmode="none" aria-label="粘贴截图" placeholder="点这里，按 Ctrl / ⌘ + V 粘贴截图"></textarea>
    <div class="screenshot-tools"><button type="button" id="chooseScreenshot">上传图片</button><small id="screenshotCount"></small></div>
  </div>
  <p id="photoStatus" class="editor-hint" role="status"></p>
</div></section>
<div class="ai-bridge">
  <button type="button" class="primary" id="organize" aria-controls="draft" aria-expanded="false"><span class="organize-icon" aria-hidden="true">✦</span><span id="organizeLabel">AI 帮我整理</span></button>
</div></details>
<p id="editStatus" role="status"></p>
